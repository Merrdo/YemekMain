<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Yemek Yapalım</title>
<meta name="apple-mobile-web-app-title" content="Yemek Yapalım">
<!-- manifest bilerek yok: iOS ana ekran uygulamasında manifest varken pencere 47px kısa açılıyor; meta etiketleri yeterli -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2EBDD;--paper2:#E9DFCB;--card:#FAF5EA;--ink:#2B221B;--ink2:#7A6C5D;
  --line:rgba(43,34,27,.13);--clay:#B4532F;--sun:#D9A23C;--olive:#5F6B3C;--cream:#F6EFE2;
  --st:0px;--sb:0px;--W:390px;--H:844px;
  --grain:none;--pbg:var(--paper) var(--grain);
  --ease:cubic-bezier(.32,.72,0,1);
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{position:fixed;left:0;top:0;width:var(--W);height:var(--H);overflow:hidden;background:var(--pbg);overscroll-behavior:none}
body{position:fixed;left:0;top:0;width:var(--W);height:var(--H);overflow:hidden;background:var(--pbg);overscroll-behavior:none}
img,canvas{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}
img{pointer-events:none}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;font-family:var(--sans);color:var(--ink)}
button{font-family:var(--sans);cursor:pointer;color:inherit}
#app{position:fixed;left:0;top:0;width:var(--W);height:var(--H);overflow:hidden;background:var(--pbg)}
.view{position:absolute;inset:0;background:var(--pbg);will-change:transform}
#home{z-index:1}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.ic{display:block;pointer-events:none}
.tap{transition:transform .28s var(--ease),opacity .25s}
.tap:active{transform:scale(.975)}

/* ---------- Ana sayfa ---------- */
.head{padding:calc(var(--st) + 26px) 26px 0}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--clay);font-weight:600;animation:fade .5s both}
.h1{font-family:var(--serif);font-weight:400;font-size:48px;line-height:1.02;letter-spacing:-.025em;margin-top:10px;font-variation-settings:"SOFT" 100,"opsz" 144;animation:fade .5s both}
.h1 em{font-style:italic;color:var(--clay)}
.search{position:relative;margin:26px 26px 0;display:flex;align-items:center;gap:12px;height:48px;border-bottom:1px solid var(--line);animation:fade .5s both}
.search::after{content:'';position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:var(--clay);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.search:focus-within::after{transform:scaleX(1)}
.search input{flex:1;background:none;border:0;outline:0;font-size:17px;height:100%;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:#A99B89}
.search input::-webkit-search-cancel-button{display:none}
.clr{width:30px;height:30px;border:0;background:var(--paper2);border-radius:50%;display:grid;place-items:center;opacity:0;transform:scale(.6);pointer-events:none;transition:all .35s var(--ease)}
.clr.on{opacity:1;transform:none;pointer-events:auto}
.cats{overflow-x:auto;scrollbar-width:none;padding:0 26px;margin-top:22px;animation:fade .5s both}
.cats::-webkit-scrollbar{display:none}
.cats-in{position:relative;display:flex;gap:24px;width:max-content;padding-bottom:16px}
.cat{background:none;border:0;padding:4px 0;font:400 25px var(--serif);font-variation-settings:"SOFT" 100,"opsz" 72;letter-spacing:-.01em;color:#ABA08F;transition:color .35s;white-space:nowrap}
.cat.on{color:var(--ink)}
.brush{position:absolute;left:-14px;bottom:0;height:14px;width:calc(100% + 28px);pointer-events:none}
.info{display:flex;justify-content:space-between;align-items:center;padding:6px 26px 18px;animation:fade .5s both}
.count{font-size:13px;color:var(--ink2)}
.sortb{display:flex;align-items:center;gap:8px;background:none;border:0;font-size:13px;color:var(--ink2);padding:6px 0 6px 10px}
.list{padding-bottom:calc(var(--sb)*.5 + 120px)}
.card{display:block;margin:0 20px 30px;animation:fade .3s both;cursor:pointer}
.list.quick .card{animation:fade .22s both;animation-delay:0s}
.card .ph{position:relative;aspect-ratio:4/3.15;border-radius:28px;overflow:hidden;background:var(--paper2);box-shadow:0 22px 34px -20px rgba(70,40,15,.55)}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block;}
.card .ph::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(30,20,12,.35),rgba(30,20,12,0) 45%);pointer-events:none}
.badge{position:absolute;left:16px;bottom:14px;z-index:2;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cream);font-weight:600}
.card .tt{font:400 26px/1.12 var(--serif);letter-spacing:-.015em;margin:16px 6px 0;font-variation-settings:"SOFT" 100,"opsz" 96}
.card .mt{display:flex;justify-content:space-between;align-items:center;margin:8px 6px 0;font-size:13.5px;color:var(--ink2)}
.none{padding:50px 40px;text-align:center;color:var(--ink2);font-size:15px;animation:fade .5s both}
.empty{display:flex;flex-direction:column;align-items:center;padding:34px 40px;text-align:center;animation:fade .5s both}
.empty h3{font:400 28px var(--serif);margin-top:14px;font-variation-settings:"SOFT" 100,"opsz" 96}
.empty p{color:var(--ink2);font-size:15px;line-height:1.5;margin-top:8px;max-width:260px}

.fab{position:absolute;left:50%;bottom:calc(var(--sb)*.5 + 16px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;height:58px;padding:0 26px 0 22px;border-radius:29px;background:var(--ink);color:var(--cream);font:600 16px var(--sans);border:0;box-shadow:0 10px 24px -8px rgba(43,34,27,.45);z-index:20;transition:transform .4s var(--ease),padding .4s var(--ease),gap .4s var(--ease),opacity .3s}
.fab:active{transform:translateX(-50%) scale(.95)}
.fab span{max-width:160px;overflow:hidden;white-space:nowrap;transition:max-width .4s var(--ease),opacity .25s}
.fab.mini{gap:0;padding:0 20px}
.fab.mini span{max-width:0;opacity:0}
.fab.sun{background:var(--clay)}

/* ---------- Detay ---------- */
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:calc(var(--H)*.52);scrollbar-width:none;background:var(--paper2)}
.gal::-webkit-scrollbar{display:none}
.gi{flex:0 0 100%;scroll-snap-align:center;position:relative;overflow:hidden}
.gi img{width:100%;height:100%;object-fit:cover;display:block}
.vt{background:#2a1f17;display:grid;place-items:center}
.vt img{position:absolute;inset:0;opacity:.7}
.vt .pl{position:relative;z-index:2;width:74px;height:74px;border-radius:50%;background:rgba(246,239,226,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;place-items:center;border:1px solid rgba(255,255,255,.35);padding-left:4px}
.vt small{position:absolute;z-index:2;bottom:64px;left:0;right:0;text-align:center;color:var(--cream);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.dots{position:absolute;left:0;right:0;top:calc(var(--H)*.52 - 48px);display:flex;justify-content:center;gap:6px;z-index:4;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.55);transition:all .45s var(--ease)}
.dots i.on{width:22px;background:#fff}
.body{position:relative;margin-top:-30px;background:var(--pbg);border-radius:32px 32px 0 0;padding:30px 26px calc(var(--sb)*.5 + 130px);z-index:3}
.kick{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--clay);font-weight:600}
.dt{font:400 38px/1.05 var(--serif);letter-spacing:-.025em;margin-top:10px;font-variation-settings:"SOFT" 100,"opsz" 144}
.rate{margin-top:18px;display:flex;align-items:center;gap:12px}
.rate small{font-size:13px;color:var(--ink2)}
.meta{display:flex;gap:22px;flex-wrap:wrap;margin-top:22px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.meta div{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
.sec{font:italic 400 28px var(--serif);margin:38px 0 6px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px;font-variation-settings:"SOFT" 100,"opsz" 72}
.sec small{font:500 13px var(--sans);color:var(--ink2);font-style:normal}
.ing{display:flex;align-items:center;gap:14px;padding:14px 2px;border-bottom:1px solid var(--line);font-size:17px;line-height:1.35;cursor:pointer}
.ing span{transition:color .3s,opacity .3s;position:relative}
.ing.done span{color:var(--ink2);opacity:.6;text-decoration:line-through;text-decoration-color:rgba(43,34,27,.4)}
.stp{display:flex;gap:18px;padding:20px 0;border-bottom:1px solid var(--line)}
.stp b{font:italic 300 34px/1 var(--serif);color:var(--clay);min-width:36px;font-variation-settings:"SOFT" 100,"opsz" 144}
.stp p{font-size:17px;line-height:1.6;padding-top:3px}
.note{margin-top:30px;padding:18px 20px;background:var(--paper2);border-radius:20px;border-left:3px solid var(--clay);font-size:15.5px;line-height:1.55;color:#4A3E33}
.fbtn{position:absolute;top:calc(var(--st) + 10px);width:44px;height:44px;border-radius:50%;background:rgba(250,245,234,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:0;display:grid;place-items:center;z-index:6;box-shadow:0 8px 20px -8px rgba(0,0,0,.35)}

/* ---------- Pişirme modu ---------- */
.cook{background:#1E1712;color:var(--cream)}
.ctop{position:absolute;left:0;right:0;top:calc(var(--st) + 12px);display:flex;align-items:center;gap:16px;padding:0 20px;z-index:5}
.cbtn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(246,239,226,.18);background:rgba(246,239,226,.06);display:grid;place-items:center;flex:none}
.seg{flex:1;display:flex;gap:5px}
.seg i{flex:1;height:3px;border-radius:2px;background:rgba(246,239,226,.16);overflow:hidden}
.seg b{display:block;height:100%;background:var(--sun);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease)}
.seg i.done b{transform:scaleX(1)}
.stage{position:absolute;left:0;right:0;top:calc(var(--st) + 84px);bottom:calc(var(--sb)*.5 + 120px);overflow:hidden}
.step{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 28px}
.step .k{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--sun);font-weight:600;margin-bottom:18px}
.step .txt{font:400 31px/1.3 var(--serif);letter-spacing:-.01em;font-variation-settings:"SOFT" 100,"opsz" 72}
.step .txt.m{font-size:26px}.step .txt.s{font-size:22px;line-height:1.4}
.bignum{position:absolute;right:-6px;top:calc(var(--st) + 60px);font:italic 300 200px/1 var(--serif);color:rgba(246,239,226,.055);pointer-events:none;z-index:1}
.cbar{position:absolute;left:0;right:0;bottom:calc(var(--sb)*.5 + 16px);display:flex;align-items:center;gap:12px;padding:0 22px;z-index:5}
.rb{width:64px;height:64px;border-radius:50%;border:1px solid rgba(246,239,226,.2);background:rgba(246,239,226,.07);display:grid;place-items:center;flex:none;transition:opacity .3s,transform .35s var(--ease)}
.rb.off{opacity:.3;pointer-events:none}
.nx{flex:1;height:64px;border-radius:32px;background:var(--cream);color:var(--ink);border:0;font:600 17px var(--sans);display:flex;align-items:center;justify-content:center;gap:10px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50}

/* ---------- Editör ---------- */
.ed-h{display:flex;align-items:center;gap:14px;padding:calc(var(--st) + 14px) 22px 6px}
.ed-h .cbtn{border-color:var(--line);background:var(--paper2)}
.ed-h h2{font:italic 400 26px var(--serif);font-variation-settings:"SOFT" 100,"opsz" 72}
.ed-b{padding:10px 0 calc(var(--sb)*.5 + 130px)}
.phrow{display:flex;gap:12px;overflow-x:auto;padding:12px 26px 8px;scrollbar-width:none}
.phrow::-webkit-scrollbar{display:none}
.addph{flex:none;width:112px;height:128px;border-radius:22px;border:1.5px dashed rgba(180,83,47,.5);background:rgba(180,83,47,.05);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:12.5px;color:var(--clay);font-weight:600}
.thumb{position:relative;flex:none;width:112px;height:128px;border-radius:22px;overflow:hidden;animation:pop .35s var(--ease) both}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb em{position:absolute;left:8px;bottom:8px;font-style:normal;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#fff;background:rgba(30,20,12,.55);padding:4px 8px;border-radius:10px}
.thumb .x{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(30,20,12,.6);display:grid;place-items:center}
.busy .addph{opacity:.5}
.fg{padding:0 26px;margin-top:28px}
.lab{font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink2);font-weight:600;margin-bottom:4px}
.field{position:relative}
.field::after{content:'';position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--clay);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease);pointer-events:none}
.field:focus-within::after{transform:scaleX(1)}
.in{width:100%;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;outline:0;font-size:17px;padding:11px 0;-webkit-appearance:none;appearance:none;display:block;min-height:46px}
.in.big{font:400 32px/1.15 var(--serif);padding:8px 0 12px;letter-spacing:-.02em;font-variation-settings:"SOFT" 100,"opsz" 120}
.in::placeholder{color:#B3A593}
textarea.in{resize:none;line-height:1.55;min-height:96px}
.two{display:flex;gap:22px}.two>div{flex:1}
.fg .cats{padding:0 14px;margin:10px -14px 0;animation:none}
.sheet-root{position:absolute;inset:0;z-index:100}
.sheet-back{position:absolute;inset:0;background:rgba(30,20,12,.4)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:30px 30px 0 0;padding:12px 24px calc(var(--sb)*.6 + 20px);box-shadow:0 -10px 30px rgba(0,0,0,.18)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 18px}
.sh-t{font:400 28px/1.1 var(--serif);letter-spacing:-.015em;font-variation-settings:"SOFT" 100,"opsz" 96}
.sh-p{color:var(--ink2);font-size:15px;line-height:1.5;margin-top:8px}
.srow{display:flex;align-items:center;gap:16px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:18px 2px;font-size:17px;text-align:left}
.srow:last-child{border-bottom:0}
.btns{display:flex;gap:12px;margin-top:24px}
.bt{flex:1;height:54px;border-radius:27px;border:0;font:600 16px var(--sans);background:var(--ink);color:var(--cream)}
.bt.g{background:var(--paper2);color:var(--ink)}
.bt.c{background:var(--clay)}
.rs{display:flex;justify-content:center;margin:26px 0 4px}
.vid{position:absolute;inset:0;z-index:120;background:rgba(20,14,10,.94);display:flex;align-items:center;justify-content:center;padding:0 0}
.vid iframe{width:100%;aspect-ratio:16/9;border:0;background:#000}
.vid .cbtn{position:absolute;top:calc(var(--st) + 12px);right:20px}
#toast{position:absolute;left:50%;bottom:calc(var(--sb)*.5 + 92px);transform:translate(-50%,12px);background:var(--ink);color:var(--cream);padding:13px 20px;border-radius:22px;font-size:14.5px;font-weight:500;opacity:0;pointer-events:none;z-index:200;transition:opacity .35s var(--ease),transform .35s var(--ease);white-space:nowrap;box-shadow:0 14px 30px -10px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.editor.typing .fab{transform:translateX(-50%) translateY(150px);opacity:0;pointer-events:none}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div id="app">
  <section class="view" id="home"></section>
  <div id="toast"></div>
</div>
<script>
(()=>{
'use strict';
/* ============ Temel ============ */
const DPR=Math.min(window.devicePixelRatio||1,3);
const INK='#2B221B',INK2='#7A6C5D',CLAY='#B4532F',SUN='#D9A23C',CREAM='#F6EFE2';
const CATS=['Çorba','Ana Yemek','Hamur İşi','Kahvaltı','Salata','Tatlı','İçecek'];
const CATCOL={'Çorba':'#C98446','Ana Yemek':'#A9502D','Hamur İşi':'#BF9A58','Kahvaltı':'#CFA93F','Salata':'#74834A','Tatlı':'#B87281','İçecek':'#668683'};
const EASE='cubic-bezier(.25,.7,.25,1)';
const $=(s,r=document)=>r.querySelector(s);
/* ============ Ses: WebAudio ile üretilen yumuşak sesler (dosya yok) ============ */
const Snd=(()=>{
  let ctx=null,master=null,verb=null,on=true;
  try{on=localStorage.getItem('ses')!=='0'}catch{}
  const PENT=[523.25,587.33,659.25,783.99,880,1046.5,1174.66];
  function ensure(){
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
      ctx=new AC();master=ctx.createGain();master.gain.value=.55;
      const comp=ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;
      master.connect(comp);comp.connect(ctx.destination);
      const len=ctx.sampleRate*1.1,buf=ctx.createBuffer(2,len,ctx.sampleRate);
      for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2)}
      verb=ctx.createConvolver();verb.buffer=buf;const wet=ctx.createGain();wet.gain.value=.22;verb.connect(wet);wet.connect(master);
    }
    if(ctx.state!=='running')ctx.resume();
    return ctx;
  }
  /* tek nota: yumuşak atak, üstel sönüm, alçak geçiren filtre */
  function tone(f,t,{d=.25,g=.1,type='sine',a=.004,lp=3200,to=0,wet=.5}={}){
    const o=ctx.createOscillator(),v=ctx.createGain(),fl=ctx.createBiquadFilter();
    o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
    fl.type='lowpass';fl.frequency.value=lp;
    v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+a);v.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(fl);fl.connect(v);v.connect(master);
    if(wet){const w=ctx.createGain();w.gain.value=wet;v.connect(w);w.connect(verb)}
    o.start(t);o.stop(t+d+.05);
  }
  function bell(f,t,g=.09,d=.7){tone(f,t,{d,g,wet:.7});tone(f*2.01,t,{d:d*.5,g:g*.22,wet:.7});}
  function noise(t,{d=.03,g=.08,hp=2500,lp=9000}={}){
    const n=Math.floor(ctx.sampleRate*d),b=ctx.createBuffer(1,n,ctx.sampleRate),x=b.getChannelData(0);
    for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
    const s=ctx.createBufferSource();s.buffer=b;
    const h=ctx.createBiquadFilter();h.type='highpass';h.frequency.value=hp;
    const l=ctx.createBiquadFilter();l.type='lowpass';l.frequency.value=lp;
    const v=ctx.createGain();v.gain.value=g;s.connect(h);h.connect(l);l.connect(v);v.connect(master);s.start(t);
  }
  const S={
    tap:t=>tone(740,t,{d:.07,g:.07,wet:.15}),
    cat:t=>{tone(587.33,t,{d:.09,g:.06,wet:.2});tone(880,t+.025,{d:.07,g:.03,wet:.2})},

function starPath(ctx,cx,cy,r){

  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.5:r;ctx[i?'lineTo':'moveTo'](cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}

function Stars({value=0,size=18,gap=4,interactive=false,onChange}){
  const W=size*5+gap*4,pad=Math.ceil(size*.6),CW=W+pad*2,CH=size+pad*2;
  const [cv,x]=canvas(CW,CH);cv.style.touchAction='pan-y';cv.style.margin=`-${pad}px`;cv.style.display='block';
  cv.style.pointerEvents=interactive?'auto':'none';
  let val=value,anim=null;
  const draw=now=>{
    x.clearRect(0,0,CW,CH);
    for(let i=0;i<5;i++){
      const cx=pad+i*(size+gap)+size/2,cy=pad+size/2;let sc=1;
      if(anim&&i<anim.upto){const p=Math.min(1,Math.max(0,(now-anim.t0-i*55)/340));sc=1+.4*Math.sin(Math.PI*p)}
      const r=size*.5*sc;starPath(x,cx,cy,r);x.lineJoin='round';x.lineWidth=r*.3;
      if(i<val){x.fillStyle=x.strokeStyle=SUN;x.fill();x.stroke()}
      else{x.strokeStyle='rgba(43,34,27,.26)';x.stroke()}
    }
  };
  const run=()=>{
    const tick=n=>{draw(n);if(anim&&n-anim.t0<340+5*55)requestAnimationFrame(tick);else{anim=null;draw(performance.now())}};
    requestAnimationFrame(tick);
  };
  draw(0);
  if(interactive){
    const pick=(e,first)=>{
      const r=cv.getBoundingClientRect();
      let i=Math.floor((e.clientX-r.left-pad)/(size+gap))+1;i=Math.max(1,Math.min(5,i));
      if(first&&i===val)i=0;
      if(i!==val){val=i;anim={t0:performance.now(),upto:i};run();sfx('star',val);onChange&&onChange(val)}
    };
    let down=false;
    cv.onpointerdown=e=>{down=true;cv.setPointerCapture(e.pointerId);pick(e,true)};
    cv.onpointermove=e=>{if(down)pick(e,false)};
    cv.onpointerup=cv.onpointercancel=()=>{down=false};
  }

  return cv;
}

      g.lineTo(b,7+Math.sin(b*.07+seed+off)*1.5+off*.5);g.stroke();
    }
    g.globalAlpha=1;
  };
  const loop=()=>{
    const [a,b]=[t0,t1];const grow=x1<b||x0<a;
    x0+=(a-x0)*(grow?.16:.3);x1+=(b-x1)*(grow?.3:.16);
    draw();

  };

  btns.forEach((b,i)=>b.onclick=()=>{

    const modal=view.kind==='modal';

      ?view.el.animate([{transform:from},{transform:'translateX(100%)'}],{duration:240,easing:EASE,fill:'forwards'})
      :view.el.animate([{opacity:1,transform:'none'},{opacity:0,transform:modal?'translateY(14px)':'translateX(16px)'}],{duration:180,easing:EASE,fill:'forwards'});
    a.onfinish=()=>{view.el.remove();view.onClose&&view.onClose()};

function filtered(){
  const q=fold(state.q.trim());let items=state.all.filter(r=>state.cat==='Tümü'||r.cat===state.cat);
  if(q){
    items=items.map(r=>{const t=fold(r.title);const rank=t.startsWith(q)?0:t.split(/\s+/).some(w=>w.startsWith(q))?1:9;return{r,rank}}).filter(o=>o.rank<9).sort((a,b)=>a.rank-b.rank).map(o=>o.r);
    return items;
  }
  const by=[(a,b)=>(b.date||'').localeCompare(a.date||'')||b.created-a.created,(a,b)=>(b.rating||0)-(a.rating||0)||(b.date||'').localeCompare(a.date||''),(a,b)=>a.title.localeCompare(b.title,'tr')][state.sort];
  return items.sort(by);
}
function Card(r,i){
  const src=r.photos[0]?urlOf(r.photos[0]):plateArt(r.cat);
  return h('article',{class:'card tap',style:`--i:${i}`,onclick:()=>openDetail(r.id)},
    h('div',{class:'ph'},h('img',{src,alt:'',decoding:'async'}),h('div',{class:'badge'},r.cat)),
    h('div',{class:'tt'},r.title),
    h('div',{class:'mt'},h('span',{},fmtShort(r.date)),Stars({value:r.rating,size:15,gap:3}))
  );
}
function renderList(mode){
  const items=filtered();listEl.innerHTML='';listEl.classList.toggle('quick',mode==='quick');
  countEl.textContent=state.all.length?`${items.length} tarif`:'';
  if(!state.all.length){listEl.append(h('div',{class:'empty'},PotArt(),h('h3',{},'Defterin henüz boş'),h('p',{},'İlk tarifini ekleyerek mutfak defterini başlat.')));return}
  if(!items.length){listEl.append(h('div',{class:'none'},'Bu aramayla eşleşen tarif yok'));return}
  items.forEach((r,i)=>listEl.append(Card(r,Math.min(i,5))));
}
bus.add(()=>renderList('quick'));

/* ============ Detay ============ */
function IngList(r,checked){
  return r.ing.map((t,i)=>{
    const chk=Check(checked.has(i));
    const li=h('div',{class:'ing'+(checked.has(i)?' done':''),onclick:()=>{
      const on=!checked.has(i);on?checked.add(i):checked.delete(i);chk.set(on);li.classList.toggle('done',on);sfx(on?'check':'uncheck');
    }},chk,h('span',{},t));
    return li;
  });
}
function openVideo(id){
  const v=h('div',{class:'vid'},h('iframe',{src:`https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1&rel=0`,allow:'autoplay; encrypted-media; picture-in-picture',allowfullscreen:true}),
    h('button',{class:'cbtn tap',type:'button',onclick:()=>{v.animate([{opacity:1},{opacity:0}],{duration:240}).onfinish=()=>v.remove()}},icon('close',22,CREAM)));
  app.insertBefore(v,$('#toast'));v.animate([{opacity:0},{opacity:1}],{duration:320});
}
function openDetail(id){
  const el=h('section',{class:'view detail push'}),view={el,kind:'push'};
  const checked=new Set();
  const get=()=>state.all.find(x=>x.id===id);
  function build(){
    const r=get();if(!r)return;
    const keep=$('.scroll',el)?.scrollTop||0;el.innerHTML='';
    const items=r.photos.map(b=>h('div',{class:'gi'},h('img',{src:urlOf(b),alt:''})));
    const yt=ytId(r.video);
    if(yt)items.push(h('div',{class:'gi vt tap',onclick:()=>openVideo(yt)},h('img',{src:`https://i.ytimg.com/vi/${yt}/hqdefault.jpg`,alt:'',onerror:function(){this.remove()}}),h('div',{class:'pl'},icon('play',30,CREAM)),h('small',{},'Videoyu izle')));
    if(!items.length)items.push(h('div',{class:'gi'},h('img',{src:plateArt(r.cat),alt:''})));
    const gal=h('div',{class:'gal'},items);
    const dots=h('div',{class:'dots'},items.length>1?items.map((_,k)=>h('i',{class:k?'':'on'})):[]);
    gal.addEventListener('scroll',()=>{const k=Math.round(gal.scrollLeft/gal.clientWidth);[...dots.children].forEach((d,j)=>d.classList.toggle('on',j===k))},{passive:true});
    const stars=Stars({value:r.rating,size:26,gap:6,interactive:true,onChange:v=>{r.rating=v;save(r,true)}});
    const meta=h('div',{class:'meta'},
      h('div',{},icon('calendar',20,INK2,1.7),fmtLong(r.date)),
      r.time?h('div',{},icon('clock',20,INK2,1.7),`${r.time} dk`):null,
      r.serves?h('div',{},icon('plate',20,INK2,1.7),`${r.serves} kişilik`):null);
    const body=h('div',{class:'body'},
      h('div',{class:'kick'},r.cat),h('h1',{class:'dt'},r.title),
      h('div',{class:'rate'},stars,h('small',{},'Puanın')),meta,
      r.ing.length?[h('h2',{class:'sec'},'Malzemeler',h('small',{},`${r.ing.length} kalem`)),...IngList(r,checked)]:null,
      r.steps.length?[h('h2',{class:'sec'},'Hazırlanışı'),...r.steps.map((t,i)=>h('div',{class:'stp'},h('b',{},String(i+1).padStart(2,'0')),h('p',{},t)))]:null,
      r.note?h('div',{class:'note'},r.note):null);
    const sc=h('div',{class:'scroll'},gal,body);
    const back=h('button',{class:'fbtn tap',type:'button',style:'left:18px',onclick:()=>nav.pop()},icon('back',22));
    const more=h('button',{class:'fbtn tap',type:'button',style:'right:18px',onclick:()=>menu(r)},icon('more',22));
    el.append(sc,dots,back,more);
    if(r.steps.length)el.append(h('button',{class:'fab',type:'button',onclick:()=>openCook(get())},icon('play',22,CREAM),h('span',{},'Pişirmeye başla')));
    sc.scrollTop=keep;
  }
  function menu(r){
    const photo=h('input',{type:'file',accept:'image/*',multiple:true,style:'display:none'});
    photo.onchange=async()=>{for(const f of photo.files){try{r.photos.push(await compress(f))}catch{}}photo.value='';await save(r);sfx('save');toast('Fotoğraflar eklendi')};
    const box=h('div',{},photo,
      h('button',{class:'srow tap',type:'button',onclick:()=>{s.close();setTimeout(()=>openEditor(r),200)}},icon('edit',24),'Düzenle'),
      h('button',{class:'srow tap',type:'button',onclick:()=>{photo.click();s.close()}},icon('camera',24),'Fotoğraf ekle'),
      h('button',{class:'srow tap',type:'button',onclick:()=>{Snd.set(!Snd.enabled());s.close();toast(Snd.enabled()?'Sesler açık':'Sesler kapalı');sfx('tap')}},icon('sound',24),Snd.enabled()?'Sesleri kapat':'Sesleri aç'),
      h('button',{class:'srow tap',type:'button',onclick:()=>{s.close();setTimeout(()=>confirmDel(r),250)}},icon('trash',24,CLAY),h('span',{style:`color:${CLAY}`},'Tarifi sil')));
    const s=sheet(box);
  }
  function confirmDel(r){
    const box=h('div',{},h('div',{class:'sh-t'},'Tarif silinsin mi?'),h('p',{class:'sh-p'},`“${r.title}” ve fotoğrafları kalıcı olarak silinecek.`),
      h('div',{class:'btns'},h('button',{class:'bt g tap',type:'button',onclick:()=>s.close()},'Vazgeç'),
      h('button',{class:'bt c tap',type:'button',onclick:async()=>{await Store.remove(r.id);state.all=state.all.filter(x=>x.id!==r.id);s.close();nav.pop(null,true);bus.forEach(f=>f());sfx('del');toast('Tarif silindi')}},'Sil')));
    const s=sheet(box);
  }
  const refresh=quiet=>{if(!quiet)build()};
  bus.add(refresh);view.onClose=()=>bus.delete(refresh);
  build();nav.push(view);edgeBack(view);

/* ============ Pişirme modu ============ */
function rateSheet(rec){
  let v=rec.rating||0;
  const box=h('div',{},h('div',{class:'sh-t'},'Nasıl oldu?'),h('p',{class:'sh-p'},'Bu pişirmeye yıldız ver, defterde kalsın.'),
    h('div',{class:'rs'},Stars({value:v,size:44,gap:10,interactive:true,onChange:x=>v=x})),
    h('div',{class:'btns'},h('button',{class:'bt g tap',type:'button',onclick:()=>s.close()},'Şimdi değil'),
    h('button',{class:'bt tap',type:'button',onclick:async()=>{rec.rating=v;await save(rec);s.close();sfx('save');toast('Puan kaydedildi')}},'Kaydet')));
  const s=sheet(box);
}
function openCook(rec){
  const steps=rec.steps;let i=0,lock=null;const checked=new Set();
  const el=h('section',{class:'view cook'}),view={el,kind:'modal'};
  const seg=steps.map(()=>h('i',{},h('b')));
  const big=h('div',{class:'bignum'});
  const stage=h('div',{class:'stage'});
  const flash=h('div',{class:'flash'});
  const file=h('input',{type:'file',accept:'image/*',capture:'environment',style:'display:none'});
  file.onchange=async()=>{
    const f=file.files[0];if(!f)return;sfx('shutter');
    flash.animate([{opacity:.85},{opacity:0}],{duration:420});
    try{rec.photos.push(await compress(f));await save(rec,true);toast('Fotoğraf deftere eklendi')}catch{sfx('err');toast('Fotoğraf eklenemedi')}
    file.value='';
  };
  const prevB=h('button',{class:'rb tap',type:'button',onclick:()=>go(-1)},icon('prev',26,CREAM,2));
  const nxLab=h('span',{});
  const nextB=h('button',{class:'nx tap',type:'button',onclick:()=>go(1)},nxLab,icon('next',22,INK,2.2));
  const camB=h('button',{class:'rb tap',type:'button',onclick:()=>file.click()},icon('camera',26,CREAM,1.8));
  const closeB=h('button',{class:'cbtn tap',type:'button',onclick:()=>nav.pop()},icon('close',22,CREAM));
  const ingB=h('button',{class:'cbtn tap',type:'button',onclick:()=>{const b=h('div',{},h('div',{class:'sh-t',style:'margin-bottom:6px'},'Malzemeler'),...IngList(rec,checked));sheet(b)}},icon('list',22,CREAM));
  el.append(h('div',{class:'ctop'},closeB,h('div',{class:'seg'},seg),ingB),big,stage,h('div',{class:'cbar'},camB,prevB,nextB),file,flash);
  function show(dir){
    const old=stage.firstElementChild;
    const t=steps[i];const cls=t.length>190?'s':t.length>100?'m':'';
    const n=h('div',{class:'step'},h('div',{class:'k'},`Adım ${i+1} / ${steps.length}`),h('p',{class:'txt '+cls},t));
    stage.append(n);
    if(old){old.animate([{opacity:1,transform:'none'},{opacity:0,transform:`translateX(${-dir*8}px)`}],{duration:160,easing:EASE,fill:'forwards'}).onfinish=()=>old.remove()}
    n.animate([{opacity:0,transform:`translateX(${dir*8}px)`},{opacity:1,transform:'none'}],{duration:240,easing:EASE});
    big.textContent=String(i+1).padStart(2,'0');
    seg.forEach((s,k)=>s.classList.toggle('done',k<=i));
    prevB.classList.toggle('off',i===0);
    nxLab.textContent=i===steps.length-1?'Bitir':'Sonraki';
  }
  function go(d){
    const n=i+d;
    if(n<0)return;
    if(n>=steps.length){sfx('done');nav.pop(null,true);setTimeout(()=>rateSheet(rec),500);return}
    i=n;sfx('step',i);show(d);
  }
  let sx=0,sy=0;
  stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4)go(dx<0?1:-1)});
  const lockIt=async()=>{try{lock=await navigator.wakeLock.request('screen')}catch{}};
  const vis=()=>{if(document.visibilityState==='visible'&&el.isConnected)lockIt()};
  lockIt();document.addEventListener('visibilitychange',vis);
  view.onClose=()=>{document.removeEventListener('visibilitychange',vis);try{lock&&lock.release()}catch{}};
  show(0);nav.push(view);
}

/* ============ Editör ============ */
function openEditor(rec){
  const editing=!!rec;
  const d=rec?{...rec,photos:[...rec.photos]}:{id:uid(),title:'',cat:'Ana Yemek',date:today(),rating:0,time:'',serves:'',ing:[],steps:[],video:'',note:'',photos:[],created:Date.now()};
  let dirty=false;const mark=()=>{dirty=true};
  const el=h('section',{class:'view editor'}),view={el,kind:'modal'};
  const phRow=h('div',{class:'phrow'});
  const file=h('input',{type:'file',accept:'image/*',multiple:true,style:'display:none'});
  file.onchange=async()=>{
    phRow.classList.add('busy');
    for(const f of file.files){try{d.photos.push(await compress(f))}catch{}}
    file.value='';phRow.classList.remove('busy');mark();drawPh();
  };
  function drawPh(){
    phRow.innerHTML='';
    phRow.append(h('button',{class:'addph tap',type:'button',onclick:()=>file.click()},icon('camera',28,CLAY,1.7),h('span',{},'Fotoğraf ekle')));
    d.photos.forEach((b,k)=>{
      const t=h('div',{class:'thumb'},h('img',{src:urlOf(b),alt:''}),k===0?h('em',{},'Kapak'):null,
        h('button',{type:'button',class:'x',onclick:()=>{t.animate([{transform:'none',opacity:1},{transform:'scale(.6)',opacity:0}],{duration:240}).onfinish=()=>{d.photos.splice(d.photos.indexOf(b),1);mark();drawPh()}}},icon('close',12,'#fff',2.6)));
      phRow.append(t);
    });
  }
  drawPh();
  const grow=t=>{t.style.height='auto';t.style.height=Math.max(96,t.scrollHeight)+'px'};
  const ta=(val,ph)=>{const t=h('textarea',{class:'in',placeholder:ph,oninput:()=>{mark();grow(t)}},val);return t};
  const titleIn=h('input',{class:'in big',placeholder:'Yemeğin adı',value:d.title,autocomplete:'off',autocapitalize:'sentences',oninput:mark});
  const picker=CatPicker(CATS,d.cat,c=>{d.cat=c;mark()});
  const dateIn=h('input',{type:'date',class:'in',value:d.date,onchange:mark});
  const timeIn=h('input',{class:'in',inputmode:'numeric',placeholder:'45',value:d.time,oninput:mark});
  const servIn=h('input',{class:'in',inputmode:'numeric',placeholder:'4',value:d.serves,oninput:mark});
  const ingTa=ta(d.ing.join('\n'),'Her satıra bir malzeme\n2 su bardağı mercimek\n1 adet soğan');
  const stepTa=ta(d.steps.join('\n'),'Her satıra bir adım\nMercimeği yıka ve süz.\nSoğanı yağda kavur.');
  const vidIn=h('input',{class:'in',type:'url',inputmode:'url',placeholder:'YouTube bağlantısı',value:d.video,autocapitalize:'off',oninput:mark});
  const noteTa=ta(d.note,'İpuçları, değişiklikler, kimin için yaptığın…');
  const stars=Stars({value:d.rating,size:38,gap:10,interactive:true,onChange:v=>{d.rating=v;mark()}});
  const fg=(label,node)=>h('div',{class:'fg'},h('div',{class:'lab'},label),node);
  const f=n=>h('div',{class:'field'},n);
  const closeB=h('button',{class:'cbtn tap',type:'button',onclick:()=>{
    if(!dirty){nav.pop();return}
    const box=h('div',{},h('div',{class:'sh-t'},'Vazgeçilsin mi?'),h('p',{class:'sh-p'},'Yaptığın değişiklikler kaydedilmeyecek.'),
      h('div',{class:'btns'},h('button',{class:'bt g tap',type:'button',onclick:()=>s.close()},'Devam et'),h('button',{class:'bt c tap',type:'button',onclick:()=>{s.close();nav.pop()}},'Vazgeç')));
    const s=sheet(box);
  }},icon('close',22,INK));
  async function doSave(){
    const title=titleIn.value.trim();
    if(!title){titleIn.parentElement.animate(shake,{duration:420});titleIn.focus();sfx('err');toast('Yemeğe bir ad ver');return}
    const out={...d,title,cat:picker.value(),date:dateIn.value||today(),time:timeIn.value.trim(),serves:servIn.value.trim(),ing:lines(ingTa.value),steps:lines(stepTa.value),video:vidIn.value.trim(),note:noteTa.value.trim()};
    await save(out);dirty=false;sfx('save');nav.pop(null,true);toast(editing?'Değişiklikler kaydedildi':'Tarif deftere eklendi');
  }
  const saveB=h('button',{class:'fab',type:'button',onclick:doSave},icon('check',24,CREAM,2.2),h('span',{},'Kaydet'));
  const body=h('div',{class:'ed-b'},
    phRow,
    fg('Başlık',f(titleIn)),
    fg('Kategori',picker),
    fg('Tarih',f(dateIn)),
    fg('Puan',h('div',{style:'margin-top:10px'},stars)),
    h('div',{class:'fg'},h('div',{class:'two'},h('div',{},h('div',{class:'lab'},'Süre (dk)'),f(timeIn)),h('div',{},h('div',{class:'lab'},'Porsiyon'),f(servIn)))),
    fg('Malzemeler',f(ingTa)),
    fg('Hazırlanışı',f(stepTa)),
    fg('Video (isteğe bağlı)',f(vidIn)),
    fg('Not',f(noteTa)));
  el.append(h('div',{class:'scroll'},h('div',{class:'ed-h'},closeB,h('h2',{},editing?'Tarifi düzenle':'Yeni tarif')),body),saveB,file);
  el.addEventListener('focusin',e=>{if(e.target.matches('input,textarea'))el.classList.add('typing')});
  el.addEventListener('focusout',()=>setTimeout(()=>{if(!el.contains(document.activeElement)||!document.activeElement.matches('input,textarea'))el.classList.remove('typing')},60));
  el.addEventListener('touchstart',e=>{const a=document.activeElement;if(a&&a.matches&&a.matches('input,textarea')&&!e.target.closest('input,textarea'))a.blur()},{passive:true});
  nav.push(view);
  setTimeout(()=>{grow(ingTa);grow(stepTa);grow(noteTa)},60);
}

/* ============ Tanı: tarih satırına 5 kez hızlı dokun ============ */
(()=>{let n=0,t=0,box=null;const el=$('.eyebrow');if(!el)return;
  el.addEventListener('click',()=>{const now=Date.now();n=now-t<600?n+1:1;t=now;if(n<5)return;n=0;
    if(box){box.remove();box=null;return}
    const r=$('#app').getBoundingClientRect(),vv=window.visualViewport||{};
    box=h('pre',{style:'position:absolute;left:12px;right:12px;top:calc(var(--st) + 8px);z-index:999;background:rgba(0,0,0,.82);color:#9f9;font:12px/1.4 monospace;padding:10px;border-radius:12px;white-space:pre-wrap;user-select:text'},
      `inner ${innerWidth}x${innerHeight}\nvv ${vv.width}x${vv.height}\nclient ${document.documentElement.clientWidth}x${document.documentElement.clientHeight}\nscreen ${screen.width}x${screen.height}\napp ${r.width}x${r.height} top ${r.top}\nH ${getComputedStyle(document.documentElement).getPropertyValue('--H')}\nsb ${getComputedStyle(document.documentElement).getPropertyValue('--sb')||''} standalone ${navigator.standalone}`);
    app.append(box);});
})();
/* ============ PWA ============ */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
/* ============ Başlat ============ */
(function(){
  const c=document.createElement('canvas');c.width=c.height=140;const x=c.getContext('2d'),id=x.createImageData(140,140);
  for(let i=0;i<id.data.length;i+=4){id.data[i]=43;id.data[i+1]=34;id.data[i+2]=27;id.data[i+3]=Math.random()*20}
  x.putImageData(id,0,0);document.documentElement.style.setProperty('--grain',`url(${c.toDataURL()})`);
})();
(async()=>{
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
  state.all=await Store.all();
  renderList('stagger');
})();
})();
