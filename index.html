<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Index</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #fff;
    overflow: hidden;
  }
  .text {
    position: absolute;
    left: 50%;
    top: 100%;
    transform: translateX(-50%);
    font-family: Arial, sans-serif;
    font-size: 32px;
    color: #000;
    white-space: nowrap;
    animation: yukari 8s linear infinite;
  }
  @keyframes yukari {
    from { top: 100%; }
    to   { top: -10%; }
  }
</style>
</head>
<body>
  <div class="text">Merhaba</div>
</body>
</html>
